<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF 쉬운 해설 & 카드뉴스 생성기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    .spinner { border: 4px solid #e0e7ff; border-top-color: #4f46e5; border-radius: 9999px; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #toast { transition: opacity .25s ease, transform .25s ease; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-blue-100 text-slate-800">
  <main class="max-w-5xl mx-auto px-4 py-10 sm:py-14">

    <!-- 헤더 -->
    <header class="text-center mb-8">
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900">📄 PDF 논문 · 보고서 쉬운 해설 &amp; 카드뉴스</h1>
      <p class="mt-3 text-slate-600">PDF 파일을 업로드하면 Gemini가 분석해 초등학생 해설과 카드뉴스를 만들어 드립니다!</p>
    </header>

    <!-- 업로드 카드 -->
    <section class="bg-white rounded-2xl shadow-lg shadow-indigo-100 p-5 sm:p-8">
      <label id="dropzone" for="fileInput"
        class="block cursor-pointer rounded-xl border-2 border-dashed border-indigo-200 bg-indigo-50/40 px-4 py-10 text-center transition hover:border-indigo-400 hover:bg-indigo-50">
        <input id="fileInput" type="file" accept=".pdf,application/pdf" class="hidden" />
        <div class="text-4xl">📥</div>
        <p class="mt-3 font-semibold text-slate-700">여기를 클릭하거나 PDF 파일을 드래그하여 업로드하세요</p>
        <p class="mt-1 text-sm text-slate-500">지원 형식: .pdf (최대 4MB)</p>
      </label>

      <!-- 접속 코드 (기본 숨김) -->
      <div id="accessCodeWrap" class="hidden mt-5">
        <label for="accessCode" class="block text-sm font-semibold text-slate-700 mb-1">🔒 접속 코드</label>
        <input id="accessCode" type="password" autocomplete="off" placeholder="관리자에게 받은 접속 코드를 입력하세요"
          class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200" />
      </div>

      <div class="mt-5 flex flex-col sm:flex-row sm:items-center gap-4">
        <div id="fileNameWrap" class="hidden flex-1 min-w-0 items-center gap-2 text-slate-700">
          <span class="inline-block h-2.5 w-2.5 shrink-0 rounded-full bg-emerald-500"></span>
          <span id="fileName" class="truncate font-medium"></span>
        </div>
        <button id="analyzeBtn" type="button" disabled
          class="sm:ml-auto w-full sm:w-auto rounded-xl bg-indigo-600 px-6 py-3 font-bold text-white shadow-md shadow-indigo-200 transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-50">
          ✨ PDF 분석 &amp; 카드뉴스 생성하기
        </button>
      </div>
    </section>

    <!-- 로딩 -->
    <div id="loading" class="hidden mt-8 flex-col items-center gap-4 text-center">
      <div class="spinner h-12 w-12"></div>
      <p class="font-semibold text-indigo-700">PDF 파일을 읽고 Gemini가 분석 중입니다...</p>
    </div>

    <!-- 오류 -->
    <div id="errorBox" class="hidden mt-8 rounded-xl border border-red-200 bg-red-50 px-5 py-4 font-medium text-red-700"></div>

    <!-- 결과 -->
    <section id="results" class="hidden mt-10">
      <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
        <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900">🎯 분석 결과</h2>
        <button id="copyAllBtn" type="button"
          class="rounded-xl border border-indigo-200 bg-white px-4 py-2 text-sm font-semibold text-indigo-700 shadow-sm transition hover:bg-indigo-50">
          📋 전체 결과 복사하기
        </button>
      </div>

      <div class="space-y-6">
        <article class="rounded-2xl border-l-8 border-amber-400 bg-white p-6 shadow-lg shadow-amber-100/60">
          <h3 class="mb-3 text-lg font-bold text-slate-900">👧 초등학생도 이해하는 쉬운 말 해설</h3>
          <p id="card1" class="whitespace-pre-line leading-relaxed text-slate-700"></p>
        </article>

        <article class="rounded-2xl border-l-8 border-emerald-400 bg-white p-6 shadow-lg shadow-emerald-100/60">
          <h3 class="mb-4 text-lg font-bold text-slate-900">📌 핵심 테이크어웨이 (3줄 요약)</h3>
          <ol id="card2" class="space-y-3"></ol>
        </article>

        <article class="rounded-2xl border-l-8 border-indigo-500 bg-white p-6 shadow-lg shadow-indigo-100/60">
          <h3 class="mb-4 text-lg font-bold text-slate-900">📱 SNS 카드뉴스용 텍스트 (슬라이드 1 ~ 4)</h3>
          <div id="card3" class="grid grid-cols-1 gap-4 sm:grid-cols-2"></div>
        </article>
      </div>
    </section>
  </main>

  <!-- 토스트 -->
  <div id="toast" role="status" aria-live="polite"
    class="pointer-events-none fixed bottom-5 right-5 z-50 max-w-xs translate-y-2 rounded-xl bg-slate-900 px-4 py-3 text-sm font-medium text-white opacity-0 shadow-xl"></div>

  <script src="app.js"></script>
</body>
</html>
